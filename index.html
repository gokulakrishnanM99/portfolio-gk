    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // The holographic portfolio is the main site (/portfolio-gk/identity …). This same page is also served as
      // 404.html, so every path under /portfolio-gk/ arrives here first.
      // The classic site lives behind ?classic=true: hand those visits (and old classic #/ links) to classic.html,
      // which puts the address back to /portfolio-gk/<route>?classic=true.
      (function () {
        try {
          var BASE = '%BASE_URL%';
          var path = location.pathname.indexOf(BASE) === 0 ? location.pathname.slice(BASE.length) : location.pathname.replace(/^\//, '');
          path = path.replace(/^(index|404)\.html$/, '');
          var hash = location.hash.replace(/^#\/?/, '');
          var flag = new URLSearchParams(location.search).get('classic');
          var oldClassicLink = /^(portfolio|resume|certificates|works)(\/|$)/.test(hash);
          if (flag === 'true' || flag === '1' || oldClassicLink) {
            var route = '/' + (oldClassicLink ? hash : path).replace(/\/+$/, '');
            location.replace(BASE + 'classic.html?route=' + encodeURIComponent(route));
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Gokulakrishnan M · AI/ML Engineer" />
    <meta property="og:description" content="Agentic AI, LLM pipelines and vision systems, shown through a holographic interface." />
